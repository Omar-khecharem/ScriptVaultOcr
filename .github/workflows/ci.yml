# ============================================================================
# ScriptVault OCR — GitHub Actions CI
# Monorepo : backend (Ruff/Mypy/Pytest) + desktop (Pytest/PySide6) + web (Vite)
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Type check (Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Mypy
        run: pip install mypy

      - name: Mypy
        run: >
          mypy
          backend/scriptvault backend/main.py
          desktop/gui_app.py desktop/worker_thread.py desktop/build_installer.py

  python-test:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (sans PaddlePaddle : tests isolés)
        run: |
          pip install --upgrade pip
          pip install -e ./backend --no-deps
          pip install pytest httpx fastapi "uvicorn[standard]" python-multipart \
                      opencv-contrib-python numpy reportlab python-docx PyMuPDF PySide6

      - name: Run tests
        run: python -m pytest backend/tests desktop/tests -q

  web:
    name: Web (Vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
