[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptvault"
version = "2.2.0"
description = "ScriptVault OCR — moteur HTR local (TrOCR ONNX CPU) et API FastAPI partagés avec le desktop."
readme = { text = "ScriptVault OCR backend package (see repository README).", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # Moteur OCR HTR (CPU)
    "onnxruntime>=1.20,<1.28",
    "opencv-contrib-python==4.10.0.84",
    "numpy==2.3.5",
    "Pillow>=10,<13",
    # Lecture VLM local (champs manuscrits)
    "httpx>=0.27,<1",
    # API serveur
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    # Exports & PDF
    "reportlab>=4.2,<6",
    "python-docx>=1.1,<2",
    "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["scriptvault*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
